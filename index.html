<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Mini Marketplace</h1>
      <div id="user-info" style="display: none;">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="btn-sm btn-secondary">Se déconnecter</button>
      </div>
      <div id="auth-buttons">
        <button id="show-login-btn" class="btn-sm btn-primary">Se connecter</button>
      </div>
    </div>
    <p class="subtitle">Publiez vos produits, découvrez ceux des autres.</p>
  </header>

  <main>
    <!-- Formulaire (visible seulement si connecté) -->
    <section class="form-section" id="form-section" style="display: none;">
      <h2 id="form-title">Nouveau produit</h2>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="form-group">
          <label for="name">Nom du produit</label>
          <input type="text" id="name" required placeholder="Casque Bluetooth">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="2" placeholder="En deux phrases, ce que vous vendez"></textarea>
        </div>
        <div class="form-group">
          <label for="price">Prix en euros</label>
          <input type="number" id="price" step="0.01" min="0" required placeholder="29.99">
        </div>
        <div class="form-group">
          <label for="image_file">Photo</label>
          <input type="file" id="image_file" accept="image/*">
          <img id="image-preview" src="" alt="Aperçu de la photo">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submit-btn">Publier</button>
          <button type="button" class="btn-secondary" id="cancel-btn" style="display:none;">Annuler</button>
        </div>
      </form>
    </section>

    <!-- Vitrine -->
    <section class="list-section">
      <h2>Produits (<span id="product-count">0</span>)</h2>
      <div id="products-container" class="products-grid">
        <p class="loading">Chargement des produits…</p>
      </div>
    </section>
  </main>

  <!-- Modale de connexion / inscription -->
  <div id="auth-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <span class="close-modal" id="close-modal" aria-label="Fermer">&times;</span>
      <h2 id="auth-title">Connexion</h2>
      <form id="auth-form">
        <div class="form-group">
          <label for="auth-email">Adresse e-mail</label>
          <input type="email" id="auth-email" required placeholder="vous@exemple.com">
        </div>
        <div class="form-group">
          <label for="auth-password">Mot de passe (6 caractères minimum)</label>
          <input type="password" id="auth-password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="auth-submit-btn" style="width: 100%;">Se connecter</button>
      </form>
      <p class="auth-switch">
        <span id="auth-switch-text">Pas encore de compte ?</span>
        <a href="#" id="auth-switch-link">Créer un compte</a>
      </p>
    </div>
  </div>

  <script src="moteur.js"></script>
</body>
</html>
